name: Deploy pages site to GitHub Pages

# Publishes pages/ as the repo's GitHub Pages site: a landing page at / with each
# product under its own path (team convention: one Pages site per repo; see the KB page
# methods/static-data-apps.md). Template: OCHA-DAP/ds-aa-bfa-drought deploy-pages.yml.
# No build step, no credentials: pages/ is copied as-is. Restricted pages are committed
# only as encrypted page.enc files behind a gate page.

on:
  push:
    branches: [main]
    paths: ["pages/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p site
          rsync -a pages/ site/
          test -f site/index.html
          test -f site/trigger-review/index.html && test -f site/trigger-review/page.enc
          # nothing but the gate and the encrypted payload under a restricted path
          test "$(ls site/trigger-review | sort | tr '\n' ' ')" = "index.html page.enc "
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
